# Philosophy: keep lazygit defaults, only add what's missing or fix preferences.

git:
  autoFetch: false                       # default true — disable the 60s background fetch
  pagers:                                # default cat — use delta for side-by-side colored diffs
    - colorArg: always
      pager: delta --light --paging=never --side-by-side

gui:
  theme:
    lightTheme: true                     # default false (dark) — use lazygit's built-in light theme

customCommands:
  # `G` in the files view: generate a commit message via the local LLM
  # (see ~/.local/bin/ai-commit), then open $EDITOR pre-filled to review/edit/save.
  - key: "G"
    description: "AI commit message"
    context: "files"
    command: 'ai-commit > /tmp/commit-msg && git commit -eF /tmp/commit-msg'
    loadingText: "Generating commit message..."
    output: terminal
