# =============================================================================
# Philosophy: keep tmux defaults, only add what's missing or fix warts.
# Prefix stays C-b. In Helix, use C-u / PageUp instead of C-b for page-up.
# =============================================================================


# -----------------------------------------------------------------------------
# Required for modern editor (Helix) workflow
# -----------------------------------------------------------------------------
set -s escape-time 0          # default 500ms — kills the ESC delay in Helix/vim
set -g focus-events on        # let Helix detect focus to auto-reload changed files


# -----------------------------------------------------------------------------
# Default-is-too-small / off — almost everyone changes these
# -----------------------------------------------------------------------------
set -g mouse on               # default off
set -g history-limit 50000    # default 2000 — runs out fast
set -g set-clipboard on       # OSC52: copy-mode `y` reaches system clipboard over SSH


# -----------------------------------------------------------------------------
# Default behavior is a known wart
# -----------------------------------------------------------------------------
set -g base-index 1           # windows start at 0 by default; 1 matches M-1..9
setw -g pane-base-index 1     # same, for panes
set -g renumber-windows on    # close window 2 of 1/2/3 → renumber to 1/2 (no gaps)

# Open new windows/splits in the current pane's directory.
# Default behavior inherits tmux's start dir — long-standing wart.
bind c   new-window   -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"


# -----------------------------------------------------------------------------
# True color + extended underlines (needed for Helix theme + diagnostics)
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Passthrough escape sequences (clipboard OSC52, image protocols, etc.)
set -g allow-passthrough on


# -----------------------------------------------------------------------------
# Genuinely missing in defaults
# -----------------------------------------------------------------------------
# Lazygit popup
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Vi keys in copy mode (matches Helix/vim muscle memory)
setw -g mode-keys vi

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Prefix-less window switching — Alt+1..9 jumps directly
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Prefix-less session switching — Alt+H/L cycles sessions
bind -n M-h switch-client -p
bind -n M-l switch-client -n


# -----------------------------------------------------------------------------
# Workflow preferences (could go either way)
# -----------------------------------------------------------------------------
# Stay attached when the last window of a session is closed (default detaches).
set -g detach-on-destroy off

# Don't auto-rename windows to the running command — keeps any manual rename
# (via `,` or the `just` wrapper) stable.
setw -g automatic-rename off
set -g allow-rename off


# -----------------------------------------------------------------------------
# Theme — inherit from terminal (no hardcoded palette)
# All colors below resolve to whatever the terminal theme defines for those
# ANSI slots, so changing the Ghostty theme automatically restyles tmux too.
# `default` = the terminal's foreground/background.
# -----------------------------------------------------------------------------
set -g status-style                 "bg=default,fg=default"
set -g window-status-current-style  "fg=blue,bold"
set -g window-status-style          "fg=default"
set -g pane-border-style            "fg=default"
set -g pane-active-border-style     "fg=blue"
set -g message-style                "bg=blue,fg=default"

set -g status-position bottom
set -g status-left  " #S | "
set -g status-right " %H:%M "
