# Prefix: Ctrl+Space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Basics
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g detach-on-destroy off
set -g set-clipboard on
set -g focus-events on

# Passthrough (clipboard, image protocol)
set -g allow-passthrough on

# True color (Ghostty + Helix)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Window switching
bind -r C-n next-window
bind -r C-p previous-window
bind -r C-a last-window
bind c new-window -c "#{pane_current_path}"

# Splits
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# Pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Lazygit popup
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Copy mode
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Catppuccin Latte (set options BEFORE run)
set -g @catppuccin_flavor 'latte'
# set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar (AFTER catppuccin)
set -g status-position bottom
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Keep tmuxinator window names (AFTER catppuccin)
setw -g automatic-rename off
set -g allow-rename off

# Option+number = switch window (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Option+H/L = switch session (no prefix)
bind -n M-h switch-client -p
bind -n M-l switch-client -n
