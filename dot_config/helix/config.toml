theme = "catppuccin_latte"

[editor]
line-number = "relative"
auto-format = true
mouse = true
cursorline = true
auto-save = true
bufferline = "multiple"
color-modes = true
true-color = true
rulers = [80, 120]
idle-timeout = 50

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[editor.lsp]
display-messages = true
display-inlay-hints = false

[editor.indent-guides]
render = true
character = "▏"

[editor.soft-wrap]
enable = true

[keys.normal]
# Szybkie zapisywanie
"C-s" = ":write"
# Szybkie zamykanie
"C-q" = ":quit"
# Komentowanie linii
"C-/" = "toggle_comments"
# Refresh all
"C-r" = ":reload-all"
